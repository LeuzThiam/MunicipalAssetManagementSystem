services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: municipal_asset
      POSTGRES_USER: municipal_admin
      POSTGRES_PASSWORD: dev_password_change_me
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U municipal_admin -d municipal_asset"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      DB_HOST: db
    ports:
      - "8000:8000"
    volumes:
      - .:/workspace
      - ./backend:/app
      - ./data:/app/data
    working_dir: /workspace/backend
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgis_data:
